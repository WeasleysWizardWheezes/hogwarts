name: Frontend CI

on:
  workflow_call:
    inputs:
      frontend-changed:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════
  # Lint + Build
  # ═══════════════════════════════════════════════
  lint-build:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    if: inputs.frontend-changed
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

  # ═══════════════════════════════════════════════
  # Unit Tests (Vitest)
  # ═══════════════════════════════════════════════
  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    if: inputs.frontend-changed
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps

      - name: Run Unit Tests with Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════
  # E2E Tests (Playwright)
  # ═══════════════════════════════════════════════
  e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: lint-build
    if: |
      always() &&
      inputs.frontend-changed &&
      (needs.lint-build.result == 'success' || needs.lint-build.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
