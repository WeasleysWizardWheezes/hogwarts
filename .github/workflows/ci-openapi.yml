name: OpenAPI CI

on:
  workflow_call:
    inputs:
      openapi-changed:
        type: boolean
        required: true
      openapi-version-changed:
        type: boolean
        required: true
      is-pull-request:
        type: boolean
        required: true
      is-push:
        type: boolean
        required: true
      ref-name:
        type: string
        required: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════
  # Validate OpenAPI Spec
  # ═══════════════════════════════════════════════
  validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    if: inputs.openapi-changed
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-openapi

      - name: Validate OpenAPI Spec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: openapi-generator-cli validate -i openapi/api.yaml

  # ═══════════════════════════════════════════════
  # Generate Redoc Documentation
  # ═══════════════════════════════════════════════
  docs:
    name: OpenAPI Documentation (Redoc)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.openapi-changed
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate API Documentation
        run: npx @redocly/cli build-docs openapi/api.yaml -o api-docs.html

      - name: Upload API Documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          path: api-docs.html
          retention-days: 30

  # ═══════════════════════════════════════════════
  # Diff as PR Comment
  # ═══════════════════════════════════════════════
  diff:
    name: OpenAPI Diff (PR Comment)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.openapi-changed && inputs.is-pull-request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Generate OpenAPI Diff
        id: diff
        run: |
          # Install oasdiff
          go install github.com/oasdiff/oasdiff@latest

          # Generate changelog (human-readable)
          DIFF_OUTPUT=$(oasdiff changelog "origin/main:openapi/api.yaml" "openapi/api.yaml" 2>/dev/null || echo "No changes detected")

          # Write to file for the comment step
          echo "$DIFF_OUTPUT" > /tmp/api-diff.md

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/api-diff.md', 'utf8');
            const body = `## OpenAPI Changelog\n\n${diff || '_No API changes detected._'}`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## OpenAPI Changelog'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ═══════════════════════════════════════════════
  # Publish Backend API Lib (Java/Spring)
  # ═══════════════════════════════════════════════
  publish-backend:
    name: OpenAPI Publish Backend (Java/Spring)
    runs-on: ubuntu-latest
    needs: validate
    if: |
      inputs.is-push &&
      inputs.openapi-changed &&
      inputs.openapi-version-changed
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from OpenAPI Spec
        id: issue
        run: |
          RAW_VERSION=$(yq eval '.info.version' openapi/api.yaml)
          VERSION="${RAW_VERSION}-SNAPSHOT"
          echo "Version aus OpenAPI ermittelt: $VERSION (raw: $RAW_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-openapi
      - uses: ./.github/actions/setup-java

      - name: Generate Backend API Lib (Java/Spring)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          openapi-generator-cli generate \
            -i openapi/api.yaml \
            -g spring \
            -o generated/backend-api \
            --additional-properties=interfaceOnly=true,useSpringBoot3=true,useTags=true,artifactId=hogwarts-api-client \
            --artifact-version=${{ steps.issue.outputs.version }}

      - name: Publish Backend API Lib to GitHub Packages
        working-directory: generated/backend-api
        run: |
          mvn deploy \
            -s ${{ github.workspace }}/settings.xml \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }} \
            -Dmaven.deploy.skip=false \
            -DskipTests \
            --batch-mode --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════
  # Publish Frontend API Types (TypeScript)
  # ═══════════════════════════════════════════════
  publish-frontend:
    name: OpenAPI Publish Frontend (TS Types)
    runs-on: ubuntu-latest
    needs: validate
    if: |
      inputs.is-push &&
      inputs.openapi-changed &&
      inputs.openapi-version-changed
    steps:
      - uses: actions/checkout@v7

      - name: Extract and format version for Frontend
        id: issue
        run: |
          RAW_VERSION=$(yq eval '.info.version' openapi/api.yaml)
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/-SNAPSHOT//g')
          FINAL_VERSION="${CLEAN_VERSION}-build${{ github.run_number }}"
          
          echo "Formatierte Frontend-Version: $FINAL_VERSION"
          echo "version=$FINAL_VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node

      - name: Generate Frontend TS Types (openapi-typescript)
        run: |
          mkdir -p generated/frontend-api
          npx openapi-typescript openapi/api.yaml -o generated/frontend-api/schema.d.ts

      - name: Publish Frontend API Client to GitHub Packages
        working-directory: generated/frontend-api
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          cat <<EOF > package.json
          {
            "name": "@${OWNER_LOWER}/hogwarts-api-client",
            "version": "${{ steps.issue.outputs.version }}",
            "main": "schema.d.ts",
            "types": "schema.d.ts",
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            }
          }
          EOF
          
          cat <<EOF > .npmrc
          @${OWNER_LOWER}:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}
          EOF
          
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
