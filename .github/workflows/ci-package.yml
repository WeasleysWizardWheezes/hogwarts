name: Package CI

on:
  workflow_call:
    inputs:
      backend-changed:
        type: boolean
        required: true
      frontend-changed:
        type: boolean
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════════════════
  # Docker – Backend (Spring Boot Buildpacks)
  # ═══════════════════════════════════════════════
  package-backend:
    name: Package – Backend
    runs-on: ubuntu-latest
    if: inputs.backend-changed
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Spring Boot Image
        working-directory: backend
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/firemanager-backend
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:build-image \
            -s ${{ github.workspace }}/settings.xml \
            -Dspring-boot.build-image.imageName=${IMAGE_NAME,,}:latest \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username=${{ github.actor }} \
            -Ddocker.publishRegistry.password=${{ secrets.GITHUB_TOKEN }} \
            -Ddocker.publishRegistry.url=ghcr.io \
            -DskipTests \
            --batch-mode --no-transfer-progress

  # ═══════════════════════════════════════════════
  # Docker – Frontend (Dockerfile + Buildx)
  # ═══════════════════════════════════════════════
  package-frontend:
    name: Package – Frontend
    runs-on: ubuntu-latest
    if: inputs.frontend-changed
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image metadata
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/firemanager-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
