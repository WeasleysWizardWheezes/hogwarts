name: CICD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  security-events: write
  issues: write

jobs:
  # ═══════════════════════════════════════════════
  # Stage 0: Detect Changes (paths-filter)
  # ═══════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      openapi-version-changed: ${{ steps.version-check.outputs.changed }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            openapi:
              - 'openapi/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Check if OpenAPI version changed
        id: version-check
        if: steps.filter.outputs.openapi == 'true'
        run: |
          CURRENT=$(yq eval '.info.version' openapi/api.yaml 2>/dev/null || echo "")
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Push on main – skipping publish (artifacts already published from feature branch)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            MAIN_VERSION=$(git show origin/main:openapi/api.yaml 2>/dev/null | yq eval '.info.version' - 2>/dev/null || echo "")
            if [ -z "$CURRENT" ] || [ "$CURRENT" = "$MAIN_VERSION" ]; then
              echo "OpenAPI version unchanged vs main ($CURRENT) – skipping publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "OpenAPI version differs from main: main=$MAIN_VERSION → branch=$CURRENT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ═══════════════════════════════════════════════
  # Stage 1: OpenAPI (Validate + Docs + Publish)
  # ═══════════════════════════════════════════════
  openapi:
    needs: detect-changes
    if: needs.detect-changes.outputs.openapi == 'true'
    uses: ./.github/workflows/ci-openapi.yml
    with:
      openapi-changed: ${{ needs.detect-changes.outputs.openapi == 'true' }}
      openapi-version-changed: ${{ needs.detect-changes.outputs.openapi-version-changed == 'true' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
      is-push: ${{ github.event_name == 'push' }}
      ref-name: ${{ github.ref_name }}
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Stage 2: Backend CI (Tests + Quality + E2E)
  # ═══════════════════════════════════════════════
  backend:
    needs: [ detect-changes, openapi ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
    uses: ./.github/workflows/ci-backend.yml
    with:
      backend-changed: ${{ needs.detect-changes.outputs.backend == 'true' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Stage 2: Frontend CI (Lint + Build + Tests)
  # ═══════════════════════════════════════════════
  frontend:
    needs: [ detect-changes, openapi ]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
    uses: ./.github/workflows/ci-frontend.yml
    with:
      frontend-changed: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Stage 3: Security Scans (CodeQL)
  # ═══════════════════════════════════════════════
  security:
    needs: [ detect-changes, openapi ]
    if: |
      always() &&
      (github.ref_name == 'main' || github.event_name == 'pull_request') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') &&
      (needs.openapi.result == 'success' || needs.openapi.result == 'skipped')
    uses: ./.github/workflows/ci-security.yml
    with:
      backend-changed: ${{ needs.detect-changes.outputs.backend == 'true' }}
      frontend-changed: ${{ needs.detect-changes.outputs.frontend == 'true' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
      ref-name: ${{ github.ref_name }}
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Stage 4: Package (Docker – nur auf main)
  # ═══════════════════════════════════════════════
  package:
    needs: [ detect-changes, backend, frontend ]
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == 'main' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    uses: ./.github/workflows/ci-package.yml
    with:
      backend-changed: ${{ needs.detect-changes.outputs.backend == 'true' }}
      frontend-changed: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Final: Board Automation
  # ═══════════════════════════════════════════════
  board-automation:
    needs: [ detect-changes, openapi, backend, frontend, security, package ]
    if: always()
    uses: ./.github/workflows/ci-board-automation.yml
    with:
      ref-name: ${{ github.ref_name }}
      is-push: ${{ github.event_name == 'push' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
      pr-merged: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
      pr-body: ${{ github.event.pull_request.body || '' }}
    secrets: inherit
