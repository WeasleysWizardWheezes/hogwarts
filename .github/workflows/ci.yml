name: CICD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  security-events: write
  issues: write

jobs:
  # ═══════════════════════════════════════════════
  # Stage 0: Detect Changes (paths-filter)
  # ═══════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      openapi-version-changed: ${{ steps.version-check.outputs.changed }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            openapi:
              - 'openapi/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Check if OpenAPI version changed
        id: version-check
        if: steps.filter.outputs.openapi == 'true'
        run: |
          CURRENT=$(yq eval '.info.version' openapi/api.yaml 2>/dev/null || echo "")
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Push on main – skipping publish (artifacts already published from feature branch)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            MAIN_VERSION=$(git show origin/main:openapi/api.yaml 2>/dev/null | yq eval '.info.version' - 2>/dev/null || echo "")
            if [ -z "$CURRENT" ] || [ "$CURRENT" = "$MAIN_VERSION" ]; then
              echo "OpenAPI version unchanged vs main ($CURRENT) – skipping publish"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "OpenAPI version differs from main: main=$MAIN_VERSION → branch=$CURRENT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ═══════════════════════════════════════════════
  # Stage 0.5: OpenAPI – Validate + Generate + Publish
  # ═══════════════════════════════════════════════
  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.openapi == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-openapi

      - name: Validate OpenAPI Spec
        run: openapi-generator-cli validate -i openapi/api.yaml

  openapi-docs:
    name: OpenAPI Documentation (Redoc)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-validate ]
    if: needs.detect-changes.outputs.openapi == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate API Documentation
        run: npx @redocly/cli build-docs openapi/api.yaml -o api-docs.html

      - name: Upload API Documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          path: api-docs.html
          retention-days: 30

  openapi-diff:
    name: OpenAPI Diff (PR Comment)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-validate ]
    if: needs.detect-changes.outputs.openapi == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Generate OpenAPI Diff
        id: diff
        run: |
          # Install oasdiff
          go install github.com/oasdiff/oasdiff@latest

          # Generate changelog (human-readable)
          DIFF_OUTPUT=$(oasdiff changelog "origin/main:openapi/api.yaml" "openapi/api.yaml" 2>/dev/null || echo "No changes detected")

          # Write to file for the comment step
          echo "$DIFF_OUTPUT" > /tmp/api-diff.md

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/api-diff.md', 'utf8');
            const body = `## OpenAPI Changelog\n\n${diff || '_No API changes detected._'}`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## OpenAPI Changelog'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  openapi-publish-backend:
    name: OpenAPI Publish Backend (Java/Spring)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-validate ]
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.detect-changes.outputs.openapi == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from OpenAPI Spec
        id: issue
        run: |
          # yq liest den Pfad .info.version aus deiner api.yaml
          RAW_VERSION=$(yq eval '.info.version' openapi/api.yaml)
          VERSION="${RAW_VERSION}-SNAPSHOT"
          echo "Version aus OpenAPI ermittelt: $VERSION (raw: $RAW_VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-openapi
      - uses: ./.github/actions/setup-java

      - name: Generate Backend API Lib (Java/Spring)
        run: |
          openapi-generator-cli generate \
            -i openapi/api.yaml \
            -g spring \
            -o generated/backend-api \
            --additional-properties=interfaceOnly=true,useSpringBoot3=true,useTags=true,artifactId=hogwarts-api-client \
            --artifact-version=${{ steps.issue.outputs.version }}

      - name: Publish Backend API Lib to GitHub Packages
        working-directory: generated/backend-api
        run: |
          mvn deploy \
            -s ${{ github.workspace }}/settings.xml \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }} \
            -Dmaven.deploy.skip=false \
            -DskipTests \
            --batch-mode --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-publish-frontend:
    name: OpenAPI Publish Frontend (TS Types)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-validate ]
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.detect-changes.outputs.openapi == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Extract and format version for Frontend
        id: issue
        run: |
          RAW_VERSION=$(yq eval '.info.version' openapi/api.yaml)
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/-SNAPSHOT//g')
          FINAL_VERSION="${CLEAN_VERSION}-build${{ github.run_number }}"
          
          echo "Formatierte Frontend-Version: $FINAL_VERSION"
          echo "version=$FINAL_VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node

      - name: Generate Frontend TS Types (openapi-typescript)
        run: |
          mkdir -p generated/frontend-api
          npx openapi-typescript openapi/api.yaml -o generated/frontend-api/schema.d.ts

      - name: Publish Frontend API Client to GitHub Packages
        working-directory: generated/frontend-api
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          cat <<EOF > package.json
          {
            "name": "@${OWNER_LOWER}/hogwarts-api-client",
            "version": "${{ steps.issue.outputs.version }}",
            "main": "schema.d.ts",
            "types": "schema.d.ts",
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            }
          }
          EOF
          
          cat <<EOF > .npmrc
          @${OWNER_LOWER}:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}
          EOF
          
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════
  # Stage 1: Backend – Unit Tests + Coverage
  # ═══════════════════════════════════════════════
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-publish-backend ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.openapi-publish-backend.result == 'success' || needs.openapi-publish-backend.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java

      - name: Run Unit Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw test \
            -s ${{ github.workspace }}/settings.xml \
            --batch-mode --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload target directory
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════
    # Stage 2a: Frontend – Lint + Build
    # ═══════════════════════════════════════════════
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-publish-frontend ]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.openapi-publish-frontend.result == 'success' || needs.openapi-publish-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

    # ═══════════════════════════════════════════════
    # Stage 2b: Frontend – Unit Tests (Vitest)
    # ═══════════════════════════════════════════════
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-publish-frontend ]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.openapi-publish-frontend.result == 'success' || needs.openapi-publish-frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests with Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════
    # Stage 2c: Frontend – E2E Tests (Playwright)
    # ═══════════════════════════════════════════════
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [ detect-changes, frontend ]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════
    # Stage 3: Quality (Checkstyle + JaCoCo + PITest)
    # ═══════════════════════════════════════════════
  quality:
    name: Code Quality (Checkstyle + JaCoCo)
    runs-on: ubuntu-latest
    needs: [ detect-changes, test ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    # TODO: Remove continue-on-error once real tests achieve 80% coverage
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - name: Verify Quality Gates (Checkstyle + JaCoCo)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw verify \
            -s ${{ github.workspace }}/settings.xml \
            -DskipTests \
            --batch-mode --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: backend/target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  mutation-testing:
    name: Mutation Testing (PITest)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - name: Run PITest
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw pitest:mutationCoverage \
            -s ${{ github.workspace }}/settings.xml \
            --batch-mode --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Mutation Score Threshold
        working-directory: backend
        run: |
          REPORT=$(find target/pit-reports -name "mutations.xml" -type f 2>/dev/null | head -1)

          if [ -z "$REPORT" ]; then
            echo "::warning::PITest report not found – no mutations generated"
            exit 0
          fi

          TOTAL=$(grep -c '<mutation ' "$REPORT" || echo 0)
          KILLED=$(grep -c 'status="KILLED"' "$REPORT" || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::No mutations generated"
            exit 0
          fi

          SCORE=$((KILLED * 100 / TOTAL))
          echo "Mutation Score: $SCORE% ($KILLED/$TOTAL killed)"

          if [ "$SCORE" -lt 70 ]; then
            echo "::error::Mutation Score $SCORE% is below threshold of 70%"
            exit 1
          fi

      - name: Upload PITest Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: backend/target/pit-reports/
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════
    # Stage 4: E2E Tests (Testcontainers)
    # ═══════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ detect-changes, test ]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java

      - name: Run E2E Tests (Testcontainers)
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw verify \
            -s ${{ github.workspace }}/settings.xml \
            -Dsurefire.skip=true \
            --batch-mode --no-transfer-progress

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════
  # Stage 5: Security Scan (CodeQL)
  # ═══════════════════════════════════════════════
  security-scan-backend:
    name: Security Scan – Backend (CodeQL)
    runs-on: ubuntu-latest
    needs: [ detect-changes, openapi-publish-backend ]
    if: |
      always() &&
      (github.ref_name == 'main' || github.event_name == 'pull_request') &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.openapi-publish-backend.result == 'success' || needs.openapi-publish-backend.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - uses: ./.github/actions/setup-java

      - name: Build for CodeQL
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw compile \
            -s ${{ github.workspace }}/settings.xml \
            --batch-mode --no-transfer-progress \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  security-scan-frontend:
    name: Security Scan – Frontend (CodeQL)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      (github.ref_name == 'main' || github.event_name == 'pull_request') &&
      needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          source-root: frontend/

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ═══════════════════════════════════════════════
  # Stage 6: Package (Docker Images)
  # ═══════════════════════════════════════════════
  package-backend:
    name: Package – Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ quality, e2e-tests ]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Spring Boot Image
        working-directory: backend
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/firemanager-backend
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:build-image \
            -s ${{ github.workspace }}/settings.xml \
            -Dspring-boot.build-image.imageName=${IMAGE_NAME,,}:latest \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username=${{ github.actor }} \
            -Ddocker.publishRegistry.password=${{ secrets.GITHUB_TOKEN }} \
            -Ddocker.publishRegistry.url=ghcr.io \
            -DskipTests \
            --batch-mode --no-transfer-progress

  package-frontend:
    name: Package – Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [ frontend, frontend-test, frontend-e2e ]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image metadata
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/firemanager-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════
  # Final Stage: Board Automation
  # ═══════════════════════════════════════════════
  board-automation:
    name: Board Automation
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref_name != 'main'
    needs:
      - openapi-validate
      - openapi-publish-backend
      - openapi-publish-frontend
      - test
      - frontend
      - frontend-test
      - frontend-e2e
      - quality
      - e2e-tests
      - security-scan-backend
      - security-scan-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Extract origin issue number from branch
        id: origin
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" =~ ^[a-z]+/(issue-)?([0-9]+)- ]]; then
            echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "Found origin issue #${BASH_REMATCH[2]} from branch $BRANCH"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "No issue number found in branch: $BRANCH"
          fi

      - name: Find issue with awaiting-pipeline label
        if: steps.origin.outputs.number != ''
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGIN_NR=${{ steps.origin.outputs.number }}

          # Suche das Issue das awaiting-pipeline hat:
          # 1. Erst das Ursprungsticket selbst prüfen
          # 2. Dann alle Issues mit Label "origin #<nr>" prüfen
          ORIGIN_LABELS=$(gh issue view "$ORIGIN_NR" --repo ${{ github.repository }} --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$ORIGIN_LABELS" | grep -q "awaiting-pipeline"; then
            echo "number=$ORIGIN_NR" >> "$GITHUB_OUTPUT"
            echo "has_label=true" >> "$GITHUB_OUTPUT"
            echo "Found awaiting-pipeline on origin issue #$ORIGIN_NR"
          else
            # Suche Dev-/Test-Tickets mit origin-Label
            CANDIDATES=$(gh issue list --repo ${{ github.repository }} --label "origin #$ORIGIN_NR" --label "awaiting-pipeline" --state open --json number --jq '.[].number')
            FOUND=$(echo "$CANDIDATES" | head -1)
            if [ -n "$FOUND" ]; then
              echo "number=$FOUND" >> "$GITHUB_OUTPUT"
              echo "has_label=true" >> "$GITHUB_OUTPUT"
              echo "Found awaiting-pipeline on issue #$FOUND (origin #$ORIGIN_NR)"
            else
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "has_label=false" >> "$GITHUB_OUTPUT"
              echo "No issue with awaiting-pipeline found for origin #$ORIGIN_NR"
            fi
          fi

      - name: Determine role from board column
        if: steps.issue.outputs.has_label == 'true'
        id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ steps.issue.outputs.number }}

          # Board-Spalte des Issues ermitteln
          BOARD_STATUS=$(gh project item-list 1 --owner WeasleysWizardWheezes --format json -L 100 | jq -r ".items[] | select(.content.number == $ISSUE_NUMBER) | .status")
          echo "Issue #$ISSUE_NUMBER – Board-Status: $BOARD_STATUS"

          # Issue-Labels lesen (backend/frontend)
          ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --repo ${{ github.repository }} --json labels --jq '.labels[].name')
          echo "Labels: $ISSUE_LABELS"

          IS_BACKEND=$(echo "$ISSUE_LABELS" | grep -q "^backend$" && echo "true" || echo "false")
          IS_FRONTEND=$(echo "$ISSUE_LABELS" | grep -q "^frontend$" && echo "true" || echo "false")

          # Rolle und Ziel-Spalte anhand der Board-Spalte bestimmen
          case "$BOARD_STATUS" in
            "Backlog")
              echo "role=planner" >> "$GITHUB_OUTPUT"
              echo "current_column=Backlog" >> "$GITHUB_OUTPUT"
              echo "target_column=Ready Dev" >> "$GITHUB_OUTPUT"
              ;;
            "Dev")
              if [[ "$IS_BACKEND" == "true" ]]; then
                echo "role=backend-dev" >> "$GITHUB_OUTPUT"
              else
                echo "role=frontend-dev" >> "$GITHUB_OUTPUT"
              fi
              echo "current_column=Dev" >> "$GITHUB_OUTPUT"
              echo "target_column=Ready Test" >> "$GITHUB_OUTPUT"
              ;;
            "Test")
              if [[ "$IS_BACKEND" == "true" ]]; then
                echo "role=backend-tester" >> "$GITHUB_OUTPUT"
              else
                echo "role=frontend-tester" >> "$GITHUB_OUTPUT"
              fi
              echo "current_column=Test" >> "$GITHUB_OUTPUT"
              echo "target_column=Needs Review" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "role=" >> "$GITHUB_OUTPUT"
              echo "Board-Status '$BOARD_STATUS' ist keine aktive Arbeitsspalte – kein Move nötig"
              ;;
          esac

      - name: Determine pipeline result
        if: steps.paths.outputs.role != ''
        id: result
        run: |
          # Check if all relevant jobs succeeded (skipped counts as okay)
          FAILED=false

          # Planner role: only openapi-validate matters (publish jobs run only on main)
          if [[ "${{ steps.paths.outputs.role }}" == "planner" ]]; then
            if [[ "${{ needs.openapi-validate.result }}" == "failure" ]]; then
              FAILED=true
            fi
          fi

          # Backend roles: check backend-relevant jobs
          if [[ "${{ steps.paths.outputs.role }}" == backend-* ]]; then
            if [[ "${{ needs.test.result }}" == "failure" ]] || \
               [[ "${{ needs.quality.result }}" == "failure" ]] || \
               [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
              FAILED=true
            fi
          fi

          # Frontend roles: check frontend-relevant jobs
          if [[ "${{ steps.paths.outputs.role }}" == frontend-* ]]; then
            if [[ "${{ needs.frontend.result }}" == "failure" ]] || \
               [[ "${{ needs.frontend-test.result }}" == "failure" ]] || \
               [[ "${{ needs.frontend-e2e.result }}" == "failure" ]]; then
              FAILED=true
            fi
          fi

          # Security scans: only fail if they actually ran and failed (skipped is okay)
          if [[ "${{ needs.security-scan-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan-frontend.result }}" == "failure" ]]; then
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "Pipeline FAILED for role ${{ steps.paths.outputs.role }}"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "Pipeline SUCCEEDED for role ${{ steps.paths.outputs.role }}"
          fi

      - name: Remove awaiting-pipeline label
        if: steps.issue.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.issue.outputs.number }} --repo ${{ github.repository }} --remove-label "awaiting-pipeline"
          echo "Removed awaiting-pipeline label from issue #${{ steps.issue.outputs.number }}"

      - name: Post failure comment on issue
        if: steps.result.outputs.status == 'failure' && steps.paths.outputs.role != '' && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROLE="${{ steps.paths.outputs.role }}"
          ISSUE_NUMBER=${{ steps.issue.outputs.number }}
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT="## Pipeline fehlgeschlagen\n\n"
          COMMENT+="**Rolle:** $ROLE\n"
          COMMENT+="**Run:** $RUN_URL\n\n"

          if [[ "$ROLE" == backend-dev ]] || [[ "$ROLE" == frontend-dev ]]; then
            COMMENT+="Die Pipeline ist nach dem Dev-Push fehlgeschlagen. Mögliche Ursache: bestehende Tests sind durch die Code-Änderung gebrochen.\n\n"
            COMMENT+="**Ticket wird trotzdem nach Ready Test verschoben.** Der Tester muss prüfen ob seine Tests angepasst werden müssen oder ob der Produktionscode fehlerhaft ist."
          elif [[ "$ROLE" == backend-tester ]] || [[ "$ROLE" == frontend-tester ]]; then
            COMMENT+="Die Pipeline ist nach dem Tester-Push fehlgeschlagen. Das Ticket bleibt in der aktuellen Spalte.\n\n"
            COMMENT+="**Mögliche Ursachen:** Eigene Tests kompilieren nicht, Tests schlagen fehl, Coverage/Quality Gates nicht bestanden."
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$(echo -e "$COMMENT")"
          echo "Posted failure comment on issue #$ISSUE_NUMBER"

      - name: Move issue on project board (Dev roles – move on success AND failure)
        if: steps.paths.outputs.role != '' && steps.paths.outputs.role != 'planner' && (steps.paths.outputs.role == 'backend-dev' || steps.paths.outputs.role == 'frontend-dev')
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ORG="WeasleysWizardWheezes"
          PROJECT_NUMBER=1
          ISSUE_NUMBER=${{ steps.issue.outputs.number }}
          TARGET_STATUS="${{ steps.paths.outputs.target_column }}"

          # Get project ID
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')

          echo "Project ID: $PROJECT_ID"

          # Get the project item ID for this issue
          ITEM_ID=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.number == $ISSUE_NUMBER) | .id")

          echo "Item ID: $ITEM_ID"

          # Get the Status field ID and target option ID
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID")

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .id')
          OPTION_ID=$(echo "$FIELD_DATA" | jq -r ".data.node.fields.nodes[] | select(.name == \"Status\") | .options[] | select(.name == \"$TARGET_STATUS\") | .id")

          echo "Status Field ID: $STATUS_FIELD_ID"
          echo "Target Option ID: $OPTION_ID (for status: $TARGET_STATUS)"

          # Update the item status
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPTION_ID"

          echo "✅ Moved issue #$ISSUE_NUMBER to '$TARGET_STATUS'"

      - name: Move issue on project board (Tester roles – move only on success)
        if: steps.result.outputs.status == 'success' && steps.paths.outputs.role != '' && (steps.paths.outputs.role == 'backend-tester' || steps.paths.outputs.role == 'frontend-tester')
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ORG="WeasleysWizardWheezes"
          PROJECT_NUMBER=1
          ISSUE_NUMBER=${{ steps.issue.outputs.number }}
          TARGET_STATUS="${{ steps.paths.outputs.target_column }}"

          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')

          ITEM_ID=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.number == $ISSUE_NUMBER) | .id")

          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID")

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .id')
          OPTION_ID=$(echo "$FIELD_DATA" | jq -r ".data.node.fields.nodes[] | select(.name == \"Status\") | .options[] | select(.name == \"$TARGET_STATUS\") | .id")

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item { id }
              }
            }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPTION_ID"

          echo "✅ Moved issue #$ISSUE_NUMBER to '$TARGET_STATUS'"

      - name: Planner – Move dev tickets to Ready Dev and close origin ticket
        if: steps.result.outputs.status == 'success' && steps.paths.outputs.role == 'planner'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ORG="WeasleysWizardWheezes"
          PROJECT_NUMBER=1
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO#*/}"
          ISSUE_NUMBER=${{ steps.issue.outputs.number }}

          echo "Planner pipeline succeeded for issue #$ISSUE_NUMBER"

          # Get project ID
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')

          # Get Status field and Ready Dev option ID
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID")

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .id')
          READY_DEV_OPTION_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "Ready Dev") | .id')

          # Find dev tickets with label "waiting on issue #<nr>"
          DEPENDENTS=$(gh issue list --repo "$ORG/$REPO_NAME" --label "waiting on issue #$ISSUE_NUMBER" --state open --json number --jq '.[].number')

          for DEP_NUMBER in $DEPENDENTS; do
            echo "Moving dependent issue #$DEP_NUMBER to Ready Dev..."

            # Remove the waiting label
            gh issue edit "$DEP_NUMBER" --repo "$ORG/$REPO_NAME" --remove-label "waiting on issue #$ISSUE_NUMBER"

            # Get project item ID
            DEP_ITEM_ID=$(gh api graphql -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }' -f projectId="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.number == $DEP_NUMBER) | .id")

            if [ -n "$DEP_ITEM_ID" ]; then
              gh api graphql -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }' -f projectId="$PROJECT_ID" -f itemId="$DEP_ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$READY_DEV_OPTION_ID"

              echo "✅ Moved issue #$DEP_NUMBER to 'Ready Dev'"
            fi
          done

          # Close the origin ticket
          gh issue close "$ISSUE_NUMBER" --repo "$ORG/$REPO_NAME"
          echo "✅ Closed origin issue #$ISSUE_NUMBER"

  # ═══════════════════════════════════════════════
  # Sonderfall: PR Merge → Done + Unblock
  # ═══════════════════════════════════════════════
  board-automation-merge:
    name: Board Automation (PR Merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v7

      - name: Extract closed issue numbers from PR body
        id: issues
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract issue numbers from "Closes #<nr>" patterns
          NUMBERS=$(echo "$PR_BODY" | grep -oiP '(?:closes|fixes|resolves)\s+#\K[0-9]+' || true)
          echo "numbers<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NUMBERS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Found issues: $NUMBERS"

      - name: Move issues to Done and unblock dependents
        if: steps.issues.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ORG="WeasleysWizardWheezes"
          PROJECT_NUMBER=1
          REPO="${{ github.repository }}"

          # Get project ID
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org="$ORG" -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')

          # Get Status field and option IDs
          FIELD_DATA=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID")

          STATUS_FIELD_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .id')
          DONE_OPTION_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id')
          READY_DEV_OPTION_ID=$(echo "$FIELD_DATA" | jq -r '.data.node.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "Ready Dev") | .id')

          while IFS= read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] && continue
            echo "Processing issue #$ISSUE_NUMBER..."

            # Get item ID on project board
            ITEM_ID=$(gh api graphql -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }' -f projectId="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.number == $ISSUE_NUMBER) | .id")

            if [ -z "$ITEM_ID" ]; then
              echo "Issue #$ISSUE_NUMBER not found on project board – skipping"
              continue
            fi

            # Move to Done
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$DONE_OPTION_ID"

            echo "✅ Moved issue #$ISSUE_NUMBER to 'Done'"

            # Find dependent issues via label "waiting on issue #<nr>"
            REPO_NAME="${REPO#*/}"
            DEPENDENTS=$(gh issue list --repo "$ORG/$REPO_NAME" --label "waiting on issue #$ISSUE_NUMBER" --state open --json number --jq '.[].number')

            for DEP_NUMBER in $DEPENDENTS; do
              echo "Found dependent issue #$DEP_NUMBER – unblocking..."

              # Remove the waiting label
              gh issue edit "$DEP_NUMBER" --repo "$ORG/$REPO_NAME" --remove-label "waiting on issue #$ISSUE_NUMBER"

              # Move to Ready Dev on project board
              DEP_ITEM_ID=$(gh api graphql -f query='
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }' -f projectId="$PROJECT_ID" --jq ".data.node.items.nodes[] | select(.content.number == $DEP_NUMBER) | .id")

              if [ -n "$DEP_ITEM_ID" ]; then
                gh api graphql -f query='
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item { id }
                    }
                  }' -f projectId="$PROJECT_ID" -f itemId="$DEP_ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$READY_DEV_OPTION_ID"

                echo "✅ Moved dependent issue #$DEP_NUMBER to 'Ready Dev'"
              fi
            done
          done <<< "${{ steps.issues.outputs.numbers }}"
