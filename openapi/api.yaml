openapi: "3.0.3"
info:
  title: Hogwarts Firemanager API
  version: "0.0.0-issue-159"
  description: REST-API für die Verwaltung von Fahrzeugen und Fahrzeuggruppen einer Freiwilligen Feuerwehr

servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: VehicleGroups
    description: Verwaltung von Fahrzeuggruppen
  - name: Vehicles
    description: Verwaltung von Fahrzeugen

paths:
  /api/v1/vehicle-groups:
    $ref: './paths/vehicle-groups.yaml#/paths/~1api~1v1~1vehicle-groups'
  /api/v1/vehicle-groups/{vehicleGroupId}:
    $ref: './paths/vehicle-groups.yaml#/paths/~1api~1v1~1vehicle-groups~1{vehicleGroupId}'
  /api/v1/vehicles:
    $ref: './paths/vehicles.yaml#/paths/~1api~1v1~1vehicles'
  /api/v1/vehicles/{vehicleId}:
    $ref: './paths/vehicles.yaml#/paths/~1api~1v1~1vehicles~1{vehicleId}'

components:
  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
    VehicleStatus:
      $ref: './components/schemas/vehicle.yaml#/VehicleStatus'
    CreateVehicleGroupRequest:
      $ref: './components/schemas/vehicle-group.yaml#/CreateVehicleGroupRequest'
    UpdateVehicleGroupRequest:
      $ref: './components/schemas/vehicle-group.yaml#/UpdateVehicleGroupRequest'
    VehicleGroupResponse:
      $ref: './components/schemas/vehicle-group.yaml#/VehicleGroupResponse'
    CreateVehicleRequest:
      $ref: './components/schemas/vehicle.yaml#/CreateVehicleRequest'
    UpdateVehicleRequest:
      $ref: './components/schemas/vehicle.yaml#/UpdateVehicleRequest'
    VehicleResponse:
      $ref: './components/schemas/vehicle.yaml#/VehicleResponse'
  responses:
    BadRequest:
      $ref: './components/responses/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses/errors.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses/errors.yaml#/NotFound'
    Conflict:
      $ref: './components/responses/errors.yaml#/Conflict'
    InternalServerError:
      $ref: './components/responses/errors.yaml#/InternalServerError'
