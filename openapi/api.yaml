openapi: "3.0.3"
info:
  title: Hogwarts Firemanager API
  version: "0.1.0-issue-53"
  description: REST-API für die Feuerwehr-Verwaltung

servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: Members
    description: Verwaltung von Feuerwehrmitgliedern
  - name: Locations
    description: Verwaltung von Standorten
  - name: Courses
    description: Verwaltung von Qualifikationen und Lehrgängen
  - name: Member Qualifications
    description: Zuweisung von Qualifikationen an Mitglieder

paths:
  /api/v1/members:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members'
  /api/v1/members/{memberId}:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members~1{memberId}'
  /api/v1/locations:
    $ref: './paths/locations.yaml#/paths/~1api~1v1~1locations'
  /api/v1/locations/{locationId}:
    $ref: './paths/locations.yaml#/paths/~1api~1v1~1locations~1{locationId}'
  /api/v1/members/{memberId}/locations:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members~1{memberId}~1locations'
  /api/v1/courses:
    $ref: './paths/courses.yaml#/paths/~1api~1v1~1courses'
  /api/v1/courses/{courseId}:
    $ref: './paths/courses.yaml#/paths/~1api~1v1~1courses~1{courseId}'
  /api/v1/members/{memberId}/qualifications:
    $ref: './paths/member-qualifications.yaml#/paths/~1api~1v1~1members~1{memberId}~1qualifications'
  /api/v1/members/{memberId}/qualifications/{qualificationId}:
    $ref: './paths/member-qualifications.yaml#/paths/~1api~1v1~1members~1{memberId}~1qualifications~1{qualificationId}'

components:
  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
    MemberResponse:
      $ref: './components/schemas/members.yaml#/MemberResponse'
    MemberLocationAssignmentRequest:
      $ref: './components/schemas/members.yaml#/MemberLocationAssignmentRequest'
    LocationResponse:
      $ref: './components/schemas/locations.yaml#/LocationResponse'
    CreateLocationRequest:
      $ref: './components/schemas/locations.yaml#/CreateLocationRequest'
    UpdateLocationRequest:
      $ref: './components/schemas/locations.yaml#/UpdateLocationRequest'
    CourseCategory:
      $ref: './components/schemas/courses.yaml#/CourseCategory'
    CreateCourseRequest:
      $ref: './components/schemas/courses.yaml#/CreateCourseRequest'
    CourseResponse:
      $ref: './components/schemas/courses.yaml#/CourseResponse'
    CreateMemberQualificationRequest:
      $ref: './components/schemas/member-qualifications.yaml#/CreateMemberQualificationRequest'
    MemberQualificationResponse:
      $ref: './components/schemas/member-qualifications.yaml#/MemberQualificationResponse'
  responses:
    BadRequest:
      $ref: './components/responses/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses/errors.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses/errors.yaml#/NotFound'
    Conflict:
      $ref: './components/responses/errors.yaml#/Conflict'
    InternalServerError:
      $ref: './components/responses/errors.yaml#/InternalServerError'
