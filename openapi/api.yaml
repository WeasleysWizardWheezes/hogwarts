openapi: "3.0.3"
info:
  title: Hogwarts Firemanager API
  version: "0.0.0-issue-219"
  description: REST-API für die Feuerwehr-Geräteverwaltung

servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: Members
    description: Verwaltung von Feuerwehrmitgliedern
  - name: Locations
    description: Verwaltung von Standorten
  - name: VehicleGroups
    description: Verwaltung von Fahrzeuggruppen
  - name: Vehicles
    description: Verwaltung von Fahrzeugen
  - name: EquipmentCategories
    description: Verwaltung von Gerätekategorien
  - name: Equipment
    description: Verwaltung von Feuerwehrgeräten

paths:
  /api/v1/members:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members'
  /api/v1/members/{memberId}:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members~1{memberId}'
  /api/v1/locations:
    $ref: './paths/locations.yaml#/paths/~1api~1v1~1locations'
  /api/v1/locations/{locationId}:
    $ref: './paths/locations.yaml#/paths/~1api~1v1~1locations~1{locationId}'
  /api/v1/members/{memberId}/locations:
    $ref: './paths/members.yaml#/paths/~1api~1v1~1members~1{memberId}~1locations'
  /api/v1/vehicle-groups:
    $ref: './paths/vehicle-groups.yaml#/paths/~1api~1v1~1vehicle-groups'
  /api/v1/vehicle-groups/{vehicleGroupId}:
    $ref: './paths/vehicle-groups.yaml#/paths/~1api~1v1~1vehicle-groups~1{vehicleGroupId}'
  /api/v1/vehicles:
    $ref: './paths/vehicles.yaml#/paths/~1api~1v1~1vehicles'
  /api/v1/vehicles/{vehicleId}:
    $ref: './paths/vehicles.yaml#/paths/~1api~1v1~1vehicles~1{vehicleId}'
  /api/v1/equipment-categories:
    $ref: './paths/equipment-categories.yaml#/paths/~1api~1v1~1equipment-categories'
  /api/v1/equipment-categories/{categoryId}:
    $ref: './paths/equipment-categories.yaml#/paths/~1api~1v1~1equipment-categories~1{categoryId}'
  /api/v1/equipment:
    $ref: './paths/equipment.yaml#/paths/~1api~1v1~1equipment'
  /api/v1/equipment/{equipmentId}:
    $ref: './paths/equipment.yaml#/paths/~1api~1v1~1equipment~1{equipmentId}'
  /api/v1/equipment/{equipmentId}/history:
    $ref: './paths/equipment.yaml#/paths/~1api~1v1~1equipment~1{equipmentId}~1history'

components:
  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
  responses:
    BadRequest:
      $ref: './components/responses/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses/errors.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses/errors.yaml#/NotFound'
    Conflict:
      $ref: './components/responses/errors.yaml#/Conflict'
    InternalServerError:
      $ref: './components/responses/errors.yaml#/InternalServerError'