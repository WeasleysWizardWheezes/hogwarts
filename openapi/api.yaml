openapi: "3.0.3"
info:
  title: Hogwarts Firemanager API
  version: "0.0.0-issue-165"
  description: REST-API für die Feuerwehr-Personalverwaltung

servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

tags:
  - name: Location
    description: Verwaltung von Standorten
  - name: Member
    description: Verwaltung von Mitgliedern

paths:
  /api/v1/locations:
    $ref: './paths/location.yaml#/paths/~1api~1v1~1locations'
  /api/v1/locations/{locationId}:
    $ref: './paths/location.yaml#/paths/~1api~1v1~1locations~1{locationId}'
  /api/v1/members/{memberId}/location:
    $ref: './paths/location.yaml#/paths/~1api~1v1~1members~1{memberId}~1location'

components:
  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
  responses:
    BadRequest:
      $ref: './components/responses/errors.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses/errors.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses/errors.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses/errors.yaml#/NotFound'
    Conflict:
      $ref: './components/responses/errors.yaml#/Conflict'
    InternalServerError:
      $ref: './components/responses/errors.yaml#/InternalServerError'