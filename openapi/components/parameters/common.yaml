PageParam:
  name: page
  in: query
  required: false
  description: Seitennummer (0-basiert)
  schema:
    type: integer
    default: 0

SizeParam:
  name: size
  in: query
  required: false
  description: Anzahl der Elemente pro Seite
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
