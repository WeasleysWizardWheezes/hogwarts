ErrorResponse:
  type: object
  properties:
    error:
      type: string
      description: Maschinenlesbarer Error-Code
      example: "VALIDATION_FAILED"
    message:
      type: string
      description: Menschenlesbare Beschreibung
      example: "Die Anfrage enthält ungültige Felder."
    details:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
            example: "email"
          message:
            type: string
            example: "Muss eine gültige E-Mail-Adresse sein"

PaginationMeta:
  type: object
  properties:
    page:
      type: integer
      example: 0
    size:
      type: integer
      example: 20
    totalElements:
      type: integer
      example: 100
    totalPages:
      type: integer
      example: 5
