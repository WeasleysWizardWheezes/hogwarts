EquipmentCategoryResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    name:
      type: string
      example: "Atemschutz"
    description:
      type: string
      example: "Atemschutzgeräte und Zubehör"
    createdAt:
      type: string
      format: date-time
      example: "2026-01-15T10:30:00Z"
    updatedAt:
      type: string
      format: date-time
      example: "2026-01-15T10:30:00Z"

CreateEquipmentCategoryRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      example: "Atemschutz"
    description:
      type: string
      example: "Atemschutzgeräte und Zubehör"

UpdateEquipmentCategoryRequest:
  type: object
  properties:
    name:
      type: string
      example: "Atemschutz"
    description:
      type: string
      example: "Atemschutzgeräte und Zubehör"
