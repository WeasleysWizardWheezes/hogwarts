paths:
  /api/v1/members/{memberId}/documents:
    get:
      tags:
        - Documents
      summary: Alle Dokumente eines Mitglieds auflisten
      operationId: listMemberDocuments
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
      responses:
        '200':
          description: Liste aller Dokumente des Mitglieds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/documents.yaml#/DocumentResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    post:
      tags:
        - Documents
      summary: Neues Dokument hochladen
      operationId: uploadDocument
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Die hochzuladende Datei (PDF, PNG, JPG, max. 10 MB)
      responses:
        '201':
          description: Dokument erfolgreich hochgeladen
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/documents.yaml#/DocumentResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
        '413':
          $ref: '../components/responses/errors.yaml#/PayloadTooLarge'

  /api/v1/members/{memberId}/documents/{documentId}:
    get:
      tags:
        - Documents
      summary: Dokument herunterladen
      operationId: downloadDocument
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dokument wird heruntergeladen
          headers:
            Content-Disposition:
              schema:
                type: string
                description: 'Attachment; filename="filename.pdf"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    delete:
      tags:
        - Documents
      summary: Dokument löschen
      operationId: deleteDocument
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dokument erfolgreich gelöscht
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
