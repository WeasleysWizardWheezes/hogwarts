paths:
  /api/v1/members/{memberId}/assignments:
    get:
      tags: [MemberAssignments]
      summary: Alle Zuweisungen eines Members auflisten
      operationId: getMemberAssignments
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste aller Zuweisungen des Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/schemas/member-assignments.yaml#/MemberAssignmentResponse'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    post:
      tags: [MemberAssignments]
      summary: Member einer Organisationseinheit mit Funktion zuweisen
      operationId: createMemberAssignment
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/member-assignments.yaml#/CreateMemberAssignmentRequest'
      responses:
        '201':
          description: Zuweisung erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/member-assignments.yaml#/MemberAssignmentResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
        '409':
          $ref: '../components/responses/errors.yaml#/Conflict'

  /api/v1/members/{memberId}/assignments/{assignmentId}:
    delete:
      tags: [MemberAssignments]
      summary: Zuweisung entfernen
      operationId: deleteMemberAssignment
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Zuweisung erfolgreich entfernt
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

  /api/v1/organization-units/{unitId}/members:
    get:
      tags: [MemberAssignments]
      summary: Members einer Organisationseinheit auflisten
      operationId: getOrganizationUnitMembers
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
      responses:
        '200':
          description: Liste der Members in dieser Einheit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/members.yaml#/MemberResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
