paths:
  /api/v1/members:
    get:
      tags: [Members]
      summary: Alle Mitglieder auflisten
      operationId: listMembers
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
        - name: locationId
          in: query
          required: false
          description: Filter nach Standort-ID (zeigt nur Mitglieder dieses Standorts)
          schema:
            type: string
            format: uuid
        - name: locationIds
          in: query
          required: false
          description: Filter nach mehreren Standort-IDs (kommagetrennt)
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: false
      responses:
        '200':
          description: Liste aller Mitglieder
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/members.yaml#/MemberResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'

    post:
      tags: [Members]
      summary: Neues Mitglied anlegen
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/members.yaml#/CreateMemberRequest'
      responses:
        '201':
          description: Mitglied erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/members.yaml#/MemberResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '409':
          $ref: '../components/responses/errors.yaml#/Conflict'

  /api/v1/members/{memberId}:
    get:
      tags: [Members]
      summary: Mitglied anhand der ID laden
      operationId: getMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mitglied gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/members.yaml#/MemberResponse'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    put:
      tags: [Members]
      summary: Mitglied vollständig aktualisieren
      operationId: updateMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/members.yaml#/UpdateMemberRequest'
      responses:
        '200':
          description: Mitglied aktualisiert
          content:
            application/json:
              schema:
                $ref: '../components/schemas/members.yaml#/MemberResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
        '409':
          $ref: '../components/responses/errors.yaml#/Conflict'

    delete:
      tags: [Members]
      summary: Mitglied löschen
      operationId: deleteMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Mitglied gelöscht
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
        '409':
          $ref: '../components/responses/errors.yaml#/Conflict'
