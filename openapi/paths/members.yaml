paths:
  /api/v1/members:
    get:
      tags: [Members]
      summary: Alle Mitglieder auflisten
      operationId: listMembers
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: driver-license-status
          in: query
          required: false
          schema:
            type: string
            enum: [expired, warning, valid]
          description: Filter nach Führerschein-Status (expired=ROT, warning=GELB, valid=GRUEN)
      responses:
        '200':
          description: Liste aller Mitglieder
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/members.yaml#/MemberResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'

  /api/v1/members/{memberId}:
    get:
      tags: [Members]
      summary: Mitglied anhand der ID laden
      operationId: getMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mitglied gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/members.yaml#/MemberResponse'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

  /api/v1/members/{memberId}/locations:
    post:
      tags: [Members]
      summary: Mitglied einem Standort zuweisen
      operationId: assignMemberToLocation
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/members.yaml#/MemberLocationAssignmentRequest'
      responses:
        '200':
          description: Mitglied erfolgreich Standort zugewiesen
          content:
            application/json:
              schema:
                $ref: '../components/schemas/members.yaml#/MemberResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'