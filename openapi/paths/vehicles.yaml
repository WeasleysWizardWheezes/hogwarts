paths:
  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      summary: Alle Fahrzeuge auflisten
      operationId: listVehicles
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
        - name: vehicleGroupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter nach Fahrzeuggruppe
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, IN_USE, IN_MAINTENANCE, DEFECTIVE]
          description: Filter nach Status
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Archivierte Fahrzeuge einschließen (true) oder nur aktive (false)
      responses:
        '200':
          description: Liste aller Fahrzeuge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'

    post:
      tags: [Vehicles]
      summary: Neues Fahrzeug anlegen
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/CreateVehicleRequest'
      responses:
        '201':
          description: Fahrzeug erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
          description: Fahrzeuggruppe nicht gefunden

  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Fahrzeug anhand der ID laden
      operationId: getVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fahrzeug gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    put:
      tags: [Vehicles]
      summary: Fahrzeug vollständig aktualisieren
      operationId: updateVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/UpdateVehicleRequest'
      responses:
        '200':
          description: Fahrzeug aktualisiert
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    delete:
      tags: [Vehicles]
      summary: Fahrzeug archivieren (Soft Delete)
      operationId: archiveVehicle
      description: Archiviert ein Fahrzeug fachlich (Soft Delete). Das Fahrzeug bleibt in der Datenbank, wird aber als archiviert markiert und nicht mehr in Standard-Listen angezeigt.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fahrzeug archiviert
        '401':
          $ref: '../components/responses/errors.yaml#/Unauthorized'
        '403':
          $ref: '../components/responses/errors.yaml#/Forbidden'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
        '409':
          $ref: '../components/responses/errors.yaml#/Conflict'
          description: Fahrzeug kann nicht archiviert werden (z.B. bereits archiviert)
