paths:
  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      summary: Alle Fahrzeuge auflisten
      operationId: listVehicles
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
        - name: vehicleGroupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtert Fahrzeuge nach Fahrzeuggruppe
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [VERFUEGBAR, IM_EINSATZ, WARTUNG, DEFEKT]
          description: Filtert Fahrzeuge nach Status
      responses:
        '200':
          description: Liste aller Fahrzeuge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'

    post:
      tags: [Vehicles]
      summary: Neues Fahrzeug anlegen
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/CreateVehicleRequest'
      responses:
        '201':
          description: Fahrzeug erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'

  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Fahrzeug anhand der ID laden
      operationId: getVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fahrzeug gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    put:
      tags: [Vehicles]
      summary: Fahrzeug aktualisieren
      operationId: updateVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/UpdateVehicleRequest'
      responses:
        '200':
          description: Fahrzeug aktualisiert
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    delete:
      tags: [Vehicles]
      summary: Fahrzeug archivieren (Soft Delete)
      operationId: deleteVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fahrzeug erfolgreich archiviert
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'
