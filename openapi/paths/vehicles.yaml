paths:
  /api/v1/vehicle-groups:
    get:
      tags: [VehicleGroups]
      summary: Alle Fahrzeuggruppen auflisten
      operationId: listVehicleGroups
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
      responses:
        '200':
          description: Liste aller Fahrzeuggruppen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/vehicles.yaml#/VehicleGroupResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'

    post:
      tags: [VehicleGroups]
      summary: Neue Fahrzeuggruppe anlegen
      operationId: createVehicleGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/CreateVehicleGroupRequest'
      responses:
        '201':
          description: Fahrzeuggruppe erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleGroupResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'

  /api/v1/vehicle-groups/{vehicleGroupId}:
    get:
      tags: [VehicleGroups]
      summary: Fahrzeuggruppe anhand der ID laden
      operationId: getVehicleGroup
      parameters:
        - name: vehicleGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fahrzeuggruppe gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleGroupResponse'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    put:
      tags: [VehicleGroups]
      summary: Fahrzeuggruppe aktualisieren
      operationId: updateVehicleGroup
      parameters:
        - name: vehicleGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/UpdateVehicleGroupRequest'
      responses:
        '200':
          description: Fahrzeuggruppe aktualisiert
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleGroupResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    delete:
      tags: [VehicleGroups]
      summary: Fahrzeuggruppe archivieren (Soft Delete)
      operationId: archiveVehicleGroup
      parameters:
        - name: vehicleGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fahrzeuggruppe archiviert

  /api/v1/vehicles:
    get:
      tags: [Vehicles]
      summary: Alle Fahrzeuge auflisten
      operationId: listVehicles
      parameters:
        - $ref: '../components/parameters/common.yaml#/PageParam'
        - $ref: '../components/parameters/common.yaml#/SizeParam'
        - name: vehicleGroupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste aller Fahrzeuge
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
                  page:
                    $ref: '../components/schemas/common.yaml#/PaginationMeta'

    post:
      tags: [Vehicles]
      summary: Neues Fahrzeug anlegen
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/CreateVehicleRequest'
      responses:
        '201':
          description: Fahrzeug erstellt
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Fahrzeug anhand der ID laden
      operationId: getVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fahrzeug gefunden
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    put:
      tags: [Vehicles]
      summary: Fahrzeug aktualisieren
      operationId: updateVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/vehicles.yaml#/UpdateVehicleRequest'
      responses:
        '200':
          description: Fahrzeug aktualisiert
          content:
            application/json:
              schema:
                $ref: '../components/schemas/vehicles.yaml#/VehicleResponse'
        '400':
          $ref: '../components/responses/errors.yaml#/BadRequest'
        '404':
          $ref: '../components/responses/errors.yaml#/NotFound'

    delete:
      tags: [Vehicles]
      summary: Fahrzeug archivieren (Soft Delete)
      operationId: archiveVehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fahrzeug archiviert